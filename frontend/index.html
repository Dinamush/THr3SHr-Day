<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" id="meta-color-scheme" />
    <meta name="theme-color" content="#f6f5f2" id="meta-theme-color" />
    <title>THR3SHR</title>
    <!-- App icons: generated by `npm run icons` from src/shell/appIcon.js. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved palette, skin, motion and sidebar state before the body paints
      // so a reload never flashes the default.  The palette list itself lives
      // in src/theme/themes.js; an unknown name falls back to the default
      // palette here and the Appearance settings correct it on load.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem("thr3shr-theme");
          if (localStorage.getItem("thr3shr-skin") === "yorha") {
            root.dataset.skin = "yorha";
            if (localStorage.getItem("thr3shr-boot-seen") !== "1") root.classList.add("nier-booting");
          }
          if (localStorage.getItem("thr3shr-nav-collapsed") === "1") root.classList.add("nav-collapsed");
          if (localStorage.getItem("thr3shr-motion") === "reduce") root.dataset.motion = "reduce";
        } catch (e) {
          /* storage blocked: Auto palette, no skin */
        }
        if (!theme || theme === "auto" || !/^[a-z-]+$/.test(theme)) {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          theme = dark ? "graphite" : "daylight";
        }
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
